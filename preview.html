<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile README Preview - Chiranjeeb1101</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .preview-header {
      max-width: 980px;
      margin: 0 auto 20px auto;
      padding: 15px 25px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-header h2 {
      margin: 0;
      font-size: 16px;
      color: #58a6ff;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <h2>⚡ Chiranjeeb1101 - GitHub Profile README Preview (Dark Theme)</h2>
    <span style="font-size: 12px; color: #8b949e;">Local Preview Page</span>
  </div>
  <div id="content" class="markdown-body">Loading README preview...</div>

  <script>
    fetch('README.md')
      .then(res => res.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color: red;">Error loading README.md. Please ensure preview.html is in the same directory as README.md.</p>';
      });
  </script>
</body>
</html>
