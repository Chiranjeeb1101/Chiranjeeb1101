    <g transform="translate(42 124)"><g transform="translate(0 0)"><rect width="170" height="106" rx="14" fill="#151e2e" stroke="#2ed8ff"/><text x="20" y="34" fill="#55dfff" font-size="13" font-weight="700">LEVEL 01</text><text x="20" y="61" fill="#fff" font-size="19" font-weight="700">SQL</text><text x="20" y="84" fill="#8ea3b9" font-size="12">queries + joins</text></g><g transform="translate(186 0)"><rect width="170" height="106" rx="14" fill="#151e2e" stroke="#73e7b0"/><text x="20" y="34" fill="#8cf0c1" font-size="13" font-weight="700">LEVEL 02</text><text x="20" y="61" fill="#fff" font-size="19" font-weight="700">EXCEL</text><text x="20" y="84" fill="#8ea3b9" font-size="12">clean + calculate</text></g><g transform="translate(372 0)"><rect width="170" height="106" rx="14" fill="#151e2e" stroke="#f8cc47"/><text x="20" y="34" fill="#ffe283" font-size="13" font-weight="700">LEVEL 03</text><text x="20" y="61" fill="#fff" font-size="19" font-weight="700">PYTHON</text><text x="20" y="84" fill="#8ea3b9" font-size="12">pandas + EDA</text></g><g transform="translate(558 0)"><rect width="170" height="106" rx="14" fill="#151e2e" stroke="#b28dff"/><text x="20" y="34" fill="#cbb8ff" font-size="13" font-weight="700">LEVEL 04</text><text x="20" y="61" fill="#fff" font-size="19" font-weight="700">POWER BI</text><text x="20" y="84" fill="#8ea3b9" font-size="12">model + dashboard</text></g><g transform="translate(744 0)"><rect width="170" height="106" rx="14" fill="#172722" stroke="#49eca8"/><text x="20" y="34" fill="#7ef5be" font-size="13" font-weight="700">LEVEL 05</text><text x="20" y="61" fill="#fff" font-size="19" font-weight="700">PROJECTS</text><text x="20" y="84" fill="#8ea3b9" font-size="12">show the insight</text></g></g>
