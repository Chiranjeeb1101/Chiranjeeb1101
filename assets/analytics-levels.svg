  <rect width="1000" height="270" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="998" height="268" rx="19" fill="none" stroke="#3b3455"/>
  <path d="M42 104H958" stroke="#2bd9ff" stroke-width="2" stroke-dasharray="10 24" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-68" dur="2s" repeatCount="indefinite"/></path>
  <circle r="5" fill="#52f0ae"><animateMotion dur="5s" repeatCount="indefinite" path="M42 104H958"/></circle>
