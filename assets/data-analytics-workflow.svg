<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>

  <rect width="900" height="200" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="30" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="1.5">END-TO-END BUSINESS ANALYTICS &amp; DECISION PIPELINE</text>

  <!-- Step 1: Business Problem -->
  <g transform="translate(24, 52)">
    <rect width="150" height="120" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <rect width="150" height="4" rx="2" fill="#ff7b72" />
    <circle cx="20" cy="24" r="10" fill="#ff7b72" opacity="0.2" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ff7b72" text-anchor="middle">01</text>
    <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Business Request</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Vague business goal</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Revenue/Cost friction</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Stakeholder scope</text>
    <text x="14" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff7b72">[PROBLEM]</text>
  </g>

  <!-- Arrow 1-2 -->
  <line x1="180" y1="112" x2="194" y2="112" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: MECE Framing -->
  <g transform="translate(198, 52)">
    <rect width="150" height="120" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <rect width="150" height="4" rx="2" fill="#f2c811" />
    <circle cx="20" cy="24" r="10" fill="#f2c811" opacity="0.2" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#f2c811" text-anchor="middle">02</text>
    <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">MECE Framing</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Issue Trees &amp; Sub-Qs</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Metric definition</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Hypothesis formulation</text>
    <text x="14" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f2c811">[DECOMPOSITION]</text>
  </g>

  <!-- Arrow 2-3 -->
  <line x1="354" y1="112" x2="368" y2="112" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: SQL & Data Recon -->
  <g transform="translate(372, 52)">
    <rect width="150" height="120" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <rect width="150" height="4" rx="2" fill="#00E5FF" />
    <circle cx="20" cy="24" r="10" fill="#00E5FF" opacity="0.2" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#00E5FF" text-anchor="middle">03</text>
    <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">SQL &amp; Data Recon</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• CTEs &amp; Window Funcs</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Table grain validation</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Data cleaning &amp; QA</text>
    <text x="14" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF">[QUERY ENGINE]</text>
  </g>

  <!-- Arrow 3-4 -->
  <line x1="528" y1="112" x2="542" y2="112" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: BI & DAX Modeling -->
  <g transform="translate(546, 52)">
    <rect width="150" height="120" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <rect width="150" height="4" rx="2" fill="#bc8cff" />
    <circle cx="20" cy="24" r="10" fill="#bc8cff" opacity="0.2" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#bc8cff" text-anchor="middle">04</text>
    <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">BI &amp; DAX Modeling</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Star Schema design</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Measures &amp; Time-Intel</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Interactive UX / EDA</text>
    <text x="14" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#bc8cff">[MODEL ENGINE]</text>
  </g>

  <!-- Arrow 4-5 -->
  <line x1="702" y1="112" x2="716" y2="112" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Executive Narrative -->
  <g transform="translate(720, 52)">
    <rect width="156" height="120" rx="8" fill="url(#cardBg)" stroke="#7ee787" stroke-width="1" />
    <rect width="156" height="4" rx="2" fill="#7ee787" />
    <circle cx="20" cy="24" r="10" fill="#7ee787" opacity="0.2" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#7ee787" text-anchor="middle">05</text>
    <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Executive Narrative</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Strategic insights</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Actionable steps</text>
    <text x="14" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">• Quantified ROI impact</text>
    <text x="14" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7ee787">[DECISION READY]</text>
  </g>
</svg>
