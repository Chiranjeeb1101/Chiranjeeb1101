    <rect width="160" height="4" rx="2" fill="#bc8cff" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bc8cff">04. DOMAIN METRICS</text>
    <line x1="14" y1="32" x2="146" y2="32" stroke="#bc8cff" stroke-opacity="0.3" />
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">• Unit Economics</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• LTV / CAC Ratios</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Cohort Retention</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Funnel Conversion</text>
    <text x="14" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Churn Driver Analysis</text>
    <rect x="14" y="142" width="132" height="18" rx="4" fill="#0d1117" stroke="#bc8cff" stroke-width="0.5" />
    <text x="80" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#bc8cff" text-anchor="middle">BUSINESS ECONOMICS</text>
