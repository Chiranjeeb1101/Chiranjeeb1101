    <rect width="172" height="4" rx="2" fill="#ff7b72" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff7b72">05. DECISION SUPPORT</text>
    <line x1="14" y1="32" x2="158" y2="32" stroke="#ff7b72" stroke-opacity="0.3" />
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">• Data Storytelling</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• MECE Issue Trees</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• A/B Test Validation</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Financial Modeling</text>
    <text x="14" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Executive Clarity</text>
    <rect x="14" y="142" width="144" height="18" rx="4" fill="#0d1117" stroke="#ff7b72" stroke-width="0.5" />
    <text x="86" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff7b72" text-anchor="middle">EXECUTIVE STRATEGY</text>
