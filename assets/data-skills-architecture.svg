      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="cyanPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="greenPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="yellowPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2c811" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f2c811" stop-opacity="0.05" />
