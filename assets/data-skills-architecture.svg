  <rect width="900" height="240" rx="12" fill="url(#bgGrad2)" stroke="#30363d" stroke-width="1.5" />

  <!-- Section Title Header -->
  <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="1.5">DATA ANALYST CORE CAPABILITY ARCHITECTURE</text>

  <!-- Pillar 1: SQL -->
  <g transform="translate(20, 48)">
    <rect width="160" height="172" rx="8" fill="url(#cyanPillar)" stroke="#00E5FF" stroke-width="1" opacity="0.9" />
    <rect width="160" height="4" rx="2" fill="#00E5FF" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00E5FF">01. SQL ENGINE</text>
    <line x1="14" y1="32" x2="146" y2="32" stroke="#00E5FF" stroke-opacity="0.3" />
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">• PostgreSQL &amp; MySQL</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Multi-table CTEs</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Window Functions</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Query Optimization</text>
    <text x="14" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• RFM Segmentation</text>
    <rect x="14" y="142" width="132" height="18" rx="4" fill="#0d1117" stroke="#00E5FF" stroke-width="0.5" />
    <text x="80" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF" text-anchor="middle">DATA MANIPULATION</text>
  </g>

