    <rect width="160" height="4" rx="2" fill="#f2c811" />
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f2c811">03. POWER BI &amp; DAX</text>
    <line x1="14" y1="32" x2="146" y2="32" stroke="#f2c811" stroke-opacity="0.3" />
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">• Power BI &amp; Tableau</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Star Schema Design</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• DAX Measures &amp; YTD</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• Interactive UX</text>
    <text x="14" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">• C-Suite Dashboards</text>
    <rect x="14" y="142" width="132" height="18" rx="4" fill="#0d1117" stroke="#f2c811" stroke-width="0.5" />
    <text x="80" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f2c811" text-anchor="middle">BI MODELING</text>
  </g>

