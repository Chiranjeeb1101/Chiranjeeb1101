<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="900" height="230" rx="12" fill="url(#ideBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Left Column: Python / SQL Code IDE mockup -->
  <g transform="translate(20, 20)">
    <rect width="450" height="190" rx="8" fill="#090d13" stroke="#21262d" stroke-width="1" filter="url(#shadow)" />
    <!-- IDE Title Bar -->
    <rect width="450" height="28" rx="8" fill="#161b22" />
    <rect x="0" y="24" width="450" height="4" fill="#161b22" />
    <circle cx="16" cy="14" r="4" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4" fill="#27c93f" />
    <text x="60" y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">customer_cohort_analysis.py</text>
    <rect x="360" y="6" width="76" height="16" rx="4" fill="#1f242d" stroke="#00E5FF" stroke-width="0.6" />
    <text x="398" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF" text-anchor="middle">PYTHON 3.11</text>

    <!-- Code Editor Content -->
    <g transform="translate(16, 46)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text y="0"><tspan fill="#ff7b72">import</tspan><tspan fill="#c9d1d9"> pandas </tspan><tspan fill="#ff7b72">as</tspan><tspan fill="#c9d1d9"> pd</tspan></text>
      <text y="18"><tspan fill="#ff7b72">import</tspan><tspan fill="#c9d1d9"> numpy </tspan><tspan fill="#ff7b72">as</tspan><tspan fill="#c9d1d9"> np</tspan></text>
      <text y="36"><tspan fill="#8b949e"># 1. Execute SQL Query &amp; Load Cohort Data</tspan></text>
      <text y="54"><tspan fill="#79c0ff">df</tspan><tspan fill="#c9d1d9"> = pd.read_sql(</tspan><tspan fill="#a5d6ff">"SELECT * FROM user_retention"</tspan><tspan fill="#c9d1d9">, engine)</tspan></text>
      <text y="72"><tspan fill="#8b949e"># 2. Compute Cohort Retention &amp; LTV/CAC Ratio</tspan></text>
      <text y="90"><tspan fill="#79c0ff">cohort_matrix</tspan><tspan fill="#c9d1d9"> = df.pivot_table(index=</tspan><tspan fill="#a5d6ff">'Cohort'</tspan><tspan fill="#c9d1d9">, columns=</tspan><tspan fill="#a5d6ff">'Period'</tspan><tspan fill="#c9d1d9">)</tspan></text>
      <text y="108"><tspan fill="#79c0ff">ltv_cac_ratio</tspan><tspan fill="#c9d1d9"> = df[</tspan><tspan fill="#a5d6ff">'LTV'</tspan><tspan fill="#c9d1d9">].mean() / df[</tspan><tspan fill="#a5d6ff">'CAC'</tspan><tspan fill="#c9d1d9">].mean()</tspan></text>
      <text y="126"><tspan fill="#d2a8ff">print</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#a5d6ff">f"Empirical LTV/CAC Ratio: {ltv_cac_ratio:.2f}x"</tspan><tspan fill="#c9d1d9">)</tspan></text>
    </g>
  </g>

  <!-- Right Column: Graphical Visual UI Dashboard Card -->
  <g transform="translate(490, 20)">
    <rect width="390" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#shadow)" />
    
    <!-- Top KPI Widgets -->
    <g transform="translate(16, 16)">
      <!-- KPI 1 -->
      <rect width="110" height="42" rx="6" fill="#0d1117" stroke="#00E5FF" stroke-width="0.8" />
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#8b949e">RETENTION RATE</text>
      <text x="10" y="33" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00E5FF">84.2%</text>
      
      <!-- KPI 2 -->
      <g transform="translate(120, 0)">
        <rect width="110" height="42" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="0.8" />
        <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#8b949e">LTV / CAC RATIO</text>
        <text x="10" y="33" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#7ee787">4.8x</text>
      </g>
      
      <!-- KPI 3 -->
      <g transform="translate(240, 0)">
        <rect width="118" height="42" rx="6" fill="#0d1117" stroke="#f2c811" stroke-width="0.8" />
        <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#8b949e">NET REVENUE</text>
        <text x="10" y="33" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f2c811">+$142.8K</text>
      </g>
    </g>

    <!-- Visual Chart Graphics -->
    <g transform="translate(16, 70)">
      <rect width="358" height="104" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9d1d9">COHORT LTV REVENUE TREND (SQL + PANDAS)</text>
      
      <!-- Bar Chart Elements -->
      <rect x="20" y="55" width="18" height="35" rx="2" fill="url(#barGrad2)" />
      <rect x="46" y="45" width="18" height="45" rx="2" fill="url(#barGrad2)" />
      <rect x="72" y="60" width="18" height="30" rx="2" fill="url(#barGrad2)" />
      <rect x="98" y="35" width="18" height="55" rx="2" fill="url(#barGrad2)" />
      <rect x="124" y="28" width="18" height="62" rx="2" fill="url(#barGrad2)" />
      <rect x="150" y="20" width="18" height="70" rx="2" fill="url(#barGrad2)" />

      <!-- Spline Trendline -->
      <path d="M 29 55 Q 80 40, 133 28 T 340 15" fill="none" stroke="#7ee787" stroke-width="2" />
      <circle cx="29" cy="55" r="3" fill="#7ee787" />
      <circle cx="159" cy="20" r="3" fill="#7ee787" />
      <circle cx="340" cy="15" r="4" fill="#00E5FF" />
    </g>
  </g>
</svg>
